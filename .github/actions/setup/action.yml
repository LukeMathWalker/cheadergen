name: Setup
description: |
  Install Rust (stable + optionally nightly) and just.
  The caller must run `actions/checkout` first, otherwise GitHub Actions cannot
  resolve this local action.

inputs:
  components:
    description: Extra rustup components for the stable toolchain (comma-separated).
    required: false
    default: ""
  nightly:
    description: Set to "true" to also install the project's pinned nightly toolchain (read from `rust-docs-toolchain`).
    required: false
    default: "false"
  nightly-components:
    description: Extra rustup components for the nightly toolchain (comma-separated). Only used when `nightly` is "true".
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: ${{ inputs.components }}
    - id: docs-toolchain
      if: inputs.nightly == 'true'
      shell: bash
      run: echo "version=$(cat rust-docs-toolchain)" >> "$GITHUB_OUTPUT"
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      if: inputs.nightly == 'true'
      with:
        toolchain: ${{ steps.docs-toolchain.outputs.version }}
        components: ${{ inputs.nightly-components }}
        override: false
    - uses: extractions/setup-just@v2
