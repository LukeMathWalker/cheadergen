[workspace]
members = ["cheaderdiff", "cheadergen", "cheadergen_cli", "cheadergen_macros", "ui-tests/cbindgen", "ui-tests/cheadergen", "ui-tests/cli", "ui-tests/toolkit"]
resolver = "3"

[workspace.lints.clippy]
# Use `#[expect]` instead of `#[allow]` so we are warned when they become obsolete.
allow_attributes = "warn"

[workspace.lints.rustdoc]
# Our doc comments are designed for contributors, not end-users.
# Therefore there's no issue with private intra-doc links.
private-intra-doc-links = "allow"

[workspace.dependencies]
rustdoc-types = "0.57.3"
rustdoc_ext = "0.1.1"
rustdoc_ir = "0.1.1"
rustdoc_processor = "0.1.1"
rustdoc_resolver = "0.1.1"
guppy = "0.17"
