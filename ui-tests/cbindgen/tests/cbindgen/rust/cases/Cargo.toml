[workspace]
members = [
    "*",
    "dep_v2/dep",
    "expand_dep/dep",
    "expand_dep_v2/dep",
    "expand_dep_v2/dep_v2",
    "rename_crate/dependency",
    "rename_crate/no_extern",
    "rename_crate/old_dep",
]
# `cmse` uses the `cmse-nonsecure-entry` ABI, which is only supported on thumbv8m targets.
exclude = ["target", "cmse"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
cheadergen = { path = "../../../../../../cheadergen" }
