# Stand in for `<my_ffi.h>` — defines the three names with the same shape
# a real bindgen-paired header would produce, so the generated output
# compiles end-to-end.
after_includes = """
typedef unsigned long size_t;
typedef struct sockaddr_tag { unsigned short family; unsigned char data[14]; } sockaddr;
typedef enum log_level_tag { LOG_DEBUG = 0, LOG_INFO = 1, LOG_WARN = 2, LOG_ERROR = 3 } log_level;
"""

[package.ffi-dep]
types = "skip"
