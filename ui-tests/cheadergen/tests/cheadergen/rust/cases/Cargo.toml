[workspace]
# Simple (single-crate) test cases are picked up by the "*" glob.
# Partitioned (multi-crate) test cases have nested crates that must be listed
# explicitly, and the parent directory must be excluded from "*" since it has
# no Cargo.toml at its root.
members = [
    "*",
    "bin_only_skipped/lib",
    "bin_only_skipped/bin",
    "opaque_dependency/entrypoint",
    "opaque_dependency/dep",
    "partitioned_basic/entrypoint",
    "partitioned_basic/dep",
    "partitioned_bundle/entrypoint",
    "partitioned_bundle/dep",
    "partitioned_export_annotation/entrypoint",
    "partitioned_export_annotation/dep",
    "partitioned_export_opaque/entrypoint",
    "partitioned_export_opaque/dep",
    "partitioned_field_rename/entrypoint",
    "partitioned_field_rename/dep",
    "partitioned_forward_decl_kinds/entrypoint",
    "partitioned_forward_decl_kinds/dep",
    "partitioned_generic/entrypoint",
    "partitioned_generic/dep",
    "partitioned_generic_enum/entrypoint",
    "partitioned_generic_enum/dep",
    "partitioned_generic_in_dep_struct/entrypoint",
    "partitioned_generic_in_dep_struct/dep",
    "partitioned_generic_in_dep_struct/dep2",
    "partitioned_generic_overlap/entrypoint",
    "partitioned_generic_overlap/dep",
    "partitioned_generic_overlap/dep2",
    "partitioned_generic_with_dep_type/entrypoint",
    "partitioned_generic_with_dep_type/dep",
    "partitioned_generic_with_dep_type/dep2",
    "partitioned_header_rename/entrypoint",
    "partitioned_header_rename/dep",
    "partitioned_header_rename_collision/entrypoint",
    "partitioned_header_rename_collision/dep",
    "partitioned_header_rename_collision/dep2",
    "partitioned_header_rename_invalid/entrypoint",
    "partitioned_header_rename_invalid/dep",
    "partitioned_header_rename_bundle/entrypoint",
    "partitioned_mixed_usage/entrypoint",
    "partitioned_mixed_usage/dep",
    "partitioned_opaque_unchanged/entrypoint",
    "partitioned_opaque_unchanged/dep",
    "partitioned_pointer_only/entrypoint",
    "partitioned_pointer_only/dep",
    "partitioned_pointer_only_typedef/entrypoint",
    "partitioned_pointer_only_typedef/dep",
    "partitioned_pointer_only_typedef/dep2",
    "partitioned_pointer_only_with_header/entrypoint",
    "partitioned_pointer_only_with_header/dep",
    "partitioned_pointer_only_kinds/entrypoint",
    "partitioned_pointer_only_kinds/dep",
    "partitioned_rename/entrypoint",
    "partitioned_rename/dep",
    "partitioned_rename_pointer/entrypoint",
    "partitioned_rename_pointer/dep",
    "partitioned_skip_type/entrypoint",
    "partitioned_skip_type/dep",
    "partitioned_tagged_union_fwd/entrypoint",
    "partitioned_tagged_union_fwd/dep",
    "partitioned_transitive/entrypoint",
    "partitioned_transitive/dep",
    "partitioned_transitive/dep2",
    "skip_alias_preserves_name/entrypoint",
    "skip_alias_preserves_name/dep",
    "skip_bindgen_ffi/entrypoint",
    "skip_bindgen_ffi/dep",
    "skip_dependency/entrypoint",
    "skip_dependency/dep",
]
exclude = [
    "target",
    "bin_only_skipped",
    "opaque_dependency",
    "partitioned_basic",
    "partitioned_bundle",
    "partitioned_export_annotation",
    "partitioned_export_opaque",
    "partitioned_field_rename",
    "partitioned_forward_decl_kinds",
    "partitioned_generic",
    "partitioned_generic_enum",
    "partitioned_generic_in_dep_struct",
    "partitioned_generic_overlap",
    "partitioned_generic_with_dep_type",
    "partitioned_header_rename",
    "partitioned_header_rename_bundle",
    "partitioned_header_rename_collision",
    "partitioned_header_rename_invalid",
    "partitioned_mixed_usage",
    "partitioned_opaque_unchanged",
    "partitioned_pointer_only",
    "partitioned_pointer_only_typedef",
    "partitioned_pointer_only_with_header",
    "partitioned_pointer_only_kinds",
    "partitioned_rename",
    "partitioned_rename_pointer",
    "partitioned_skip_type",
    "partitioned_tagged_union_fwd",
    "partitioned_transitive",
    "skip_alias_preserves_name",
    "skip_bindgen_ffi",
    "skip_dependency",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
cheadergen = { path = "../../../../../../cheadergen" }

[workspace.lints.rustdoc]
missing_crate_level_docs = "deny"
